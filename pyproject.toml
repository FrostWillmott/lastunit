[project]
name = "lastunit"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.2",
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    # Exact pin, and it must match `rev` for ruff-pre-commit in
    # .pre-commit-config.yaml: a floating linter means CI can fail on the day a
    # new rule lands, and pre-commit disagreeing with `make lint` is worse.
    "ruff==0.16.6",
]

[tool.mypy]
strict = true
exclude = ["^frontend/", "^\\.venv/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Tests import the `app` package; the project is not installed as a package
# (uvicorn runs it from the working directory), so put the repo root on sys.path.
pythonpath = ["."]
addopts = "--cov=app --cov-fail-under=85"

[tool.coverage.run]
# __init__.py files are only re-exports (testing.md); migrations live outside app/.
omit = ["*/__init__.py"]
# sysmon (Python 3.12's sys.monitoring) traces async coroutine bodies correctly;
# the default ctrace tracer under-counts code awaited inside FastAPI routes.
core = "sysmon"
