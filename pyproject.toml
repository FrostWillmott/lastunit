[project]
name = "lastunit"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic-settings",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

[tool.mypy]
strict = true
exclude = ["^frontend/", "^\\.venv/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Tests import the `app` package; the project is not installed as a package
# (uvicorn runs it from the working directory), so put the repo root on sys.path.
pythonpath = ["."]
# No --cov-fail-under yet: the coverage threshold lands in commit 5 with the first
# real domain suite (auth). This commit's tests are config/meta checks, not a suite
# to pin a number to (testing.md "Coverage"); pytest-cov is declared now so that
# commit only adds the flag.
