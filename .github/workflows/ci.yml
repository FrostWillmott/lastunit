name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default (security audit: a job with write permissions that
# installs unpinned packages is a critical supply-chain finding). Raise per job
# only when a job genuinely needs it.
permissions:
  contents: read

# A second push supersedes the first: no stale run racing the new one to report.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions pinned by commit SHA, not moving major tags — the tag can be re-pointed,
# the SHA cannot. The trailing comment carries the human-readable version.
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Integration tests hit a real Postgres (testing.md: never mock the DB).
      DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/app
    services:
      db:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # Read from [tool.uv] required-version — never restated here. That is a
          # floor, so the action resolves the highest uv satisfying it; without a
          # version-file it would install whatever is latest regardless.
          version-file: pyproject.toml
          enable-cache: true
      # --locked: fail if uv.lock disagrees with pyproject instead of re-resolving.
      - run: uv sync --locked --all-extras
      # Backend targets only: make check would also run frontend-check, which
      # needs a node_modules this job has no Node or npm ci for. The frontend
      # job covers that half.
      - name: Lint + format + types + tests
        run: make lint format typecheck test

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # frontend-install is npm ci --ignore-scripts: no lifecycle scripts from
      # third-party packages run in CI. frontend-check is what `make check` runs.
      - run: make frontend-install frontend-check frontend-build

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version-file: pyproject.toml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # uv audit reads uv.lock and queries OSV, then npm audit reads
      # package-lock.json; non-zero exit on any finding.
      - run: make audit

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Build only — proves the images still build; no registry push.
      # `make env` generates the secrets compose refuses to run without.
      - run: make env docker-build
